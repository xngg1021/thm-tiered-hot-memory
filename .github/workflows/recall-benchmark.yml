name: THM retrieval benchmark
on:
  workflow_dispatch:
    inputs:
      full_research:
        description: 'Explicitly enable the full research dataset campaign'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  retrieval:
    if: inputs.full_research == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record source identity
        run: |
          mkdir -p benchmark-output
          git rev-parse HEAD > benchmark-output/thm-commit.txt
      - name: Install reference tokenizer and numerical backend
        run: python -m pip install tiktoken==0.11.0 numpy==2.2.6
      - name: Fetch pinned public benchmark (not committed or redistributed)
        run: |
          curl --fail --retry 3 --location https://raw.githubusercontent.com/snap-research/locomo/3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376/data/locomo10.json --output "$RUNNER_TEMP/locomo10.json"
      - name: Lexical and context-budget ablations (protocol 2)
        run: |
          python research/recall/benchmark.py --full-research --dataset "$RUNNER_TEMP/locomo10.json" --counter cl100k_base --modes literal sparse --budgets 300 600 1200 --output benchmark-output/lexical.json
          python - <<'PY'
          import json
          d=json.load(open('benchmark-output/lexical.json', encoding='utf-8'))
          assert d['protocol'] == 2, d.get('protocol')
          assert d['dataset_matches_pinned_reference'] is True
          assert d['idf_scope'] == 'one_database_per_conversation'
          PY
      - name: Chronological synthetic decay sweep
        run: python research/recall/decay_replay.py --sweep --output benchmark-output/decay.json
      - name: Install local sentence encoder for the semantic ablation
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==5.1.0 transformers==4.55.4 huggingface-hub==0.34.4
      - name: Fetch pinned public encoder weights (explicit benchmark step)
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download('sentence-transformers/all-MiniLM-L6-v2', revision='1110a243fdf4706b3f48f1d95db1a4f5529b4d41', local_dir=os.environ['RUNNER_TEMP']+'/minilm', allow_patterns=['*.json','*.txt','*.safetensors','1_Pooling/*'])
          PY
      - name: Dense and hybrid budget-matched evaluation (protocol 2)
        run: |
          python research/recall/benchmark.py --full-research --dataset "$RUNNER_TEMP/locomo10.json" --counter cl100k_base --modes dense hybrid --budgets 600 --model-path "$RUNNER_TEMP/minilm" --model-id sentence-transformers/all-MiniLM-L6-v2@1110a243fdf4706b3f48f1d95db1a4f5529b4d41 --output benchmark-output/semantic.json
          python - <<'PY'
          import json
          d=json.load(open('benchmark-output/semantic.json', encoding='utf-8'))
          assert d['protocol'] == 2, d.get('protocol')
          assert d['dataset_matches_pinned_reference'] is True
          assert d['idf_scope'] == 'one_database_per_conversation'
          PY
          python -m pip freeze > benchmark-output/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thm-retrieval-metrics-protocol2
          path: benchmark-output/
          retention-days: 30
