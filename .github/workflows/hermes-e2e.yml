name: THM Hermes integration

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_post_local_corrective.py"
      - "thm/**"
      - "plugins/**"
      - "pyproject.toml"
      - "research/hermes_e2e.py"
      - "research/runtime_cli_e2e.py"
      - "research/runtime/**"
      - "README*.md"
      - "docs/08-testing-and-release.md"
      - "docs/11-harness-adapters.md"
      - "CHANGELOG.md"
      - ".github/workflows/hermes-e2e.yml"
      - ".github/workflows/harness-e2e.yml"

permissions:
  contents: read

jobs:
  provider-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: known-good
            hermes_sha: 77915e344cb0cd8e20661d4a7b393f987a2eef32
          - label: current-reviewed
            hermes_sha: c5594ec4b34097cafbe24deb6dfd9ac4b21d411d
    env:
      HERMES_SHA: ${{ matrix.hermes_sha }}
    steps:
      - name: Check out THM
        uses: actions/checkout@v4
      - name: Check out pinned Hermes upstream
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes_sha }}
          path: .hermes-upstream
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Hermes and THM
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.hermes-upstream
          python -m pip install -e .
      - name: Run real upstream provider lifecycle
        run: |
          mkdir -p integration-output
          python research/hermes_e2e.py \
            --hermes-root .hermes-upstream \
            --expected-sha "$HERMES_SHA" \
            --output integration-output/hermes-e2e-${{ matrix.label }}.json
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thm-hermes-e2e-${{ matrix.label }}
          path: integration-output/
          retention-days: 30
