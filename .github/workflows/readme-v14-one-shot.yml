name: THM 1.4 README locale one-shot
on:
  push:
    branches:
      - chat/thm-v1.4-readme-polish-20260907
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update localized 1.4 status
        run: python scripts/update_v14_readme_locales.py
      - name: Rebuild in-page localized panels
        run: python scripts/sync_readme_locales.py
      - name: Verify locale parity
        run: python scripts/check_inpage_readme_locales.py
      - name: Verify whitespace
        shell: bash
        run: git diff --check
      - name: Commit generated README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.*.md
          if git diff --cached --quiet; then
            echo "No README changes"
          else
            git commit -m "docs: sync THM 1.4 localized readmes"
            git push origin HEAD:chat/thm-v1.4-readme-polish-20260907
          fi
