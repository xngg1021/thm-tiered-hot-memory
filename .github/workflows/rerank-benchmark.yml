name: THM rerank packing benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'thm/rerank.py'
      - 'research/recall/rerank_benchmark.py'
      - 'tests/test_rerank.py'
      - '.github/workflows/rerank-benchmark.yml'

permissions:
  contents: read

jobs:
  rerank:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tokenizer
        run: python -m pip install tiktoken==0.11.0
      - name: Fetch pinned LoCoMo data
        run: |
          curl --fail --retry 3 --location https://raw.githubusercontent.com/snap-research/locomo/3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376/data/locomo10.json --output "$RUNNER_TEMP/locomo10.json"
      - name: Run label-free sparse rerank and packing ablation
        run: |
          mkdir -p benchmark-output
          git rev-parse HEAD > benchmark-output/thm-commit.txt
          python research/recall/rerank_benchmark.py \
            --dataset "$RUNNER_TEMP/locomo10.json" \
            --counter cl100k_base \
            --budget 600 \
            --output benchmark-output/rerank.json
          python - <<'PY'
          import json
          d=json.load(open('benchmark-output/rerank.json', encoding='utf-8'))
          assert d['dataset_matches_pinned_reference'] is True
          assert d['label_inputs_to_reranker'] == 0
          assert d['generation_calls'] == 0 and d['judge_calls'] == 0
          assert d['selected_strategy'].startswith('rerank-')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thm-rerank-packing-ablation
          path: benchmark-output/
          retention-days: 30
