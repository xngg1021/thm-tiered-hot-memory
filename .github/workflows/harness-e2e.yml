name: THM harness integrations

on:
  workflow_dispatch:
  push:
    paths:
      - "thm/harness.py"
      - "thm/adapters/**"
      - "thm/mcp_server.py"
      - "research/harness_e2e.py"
      - "pyproject.toml"
      - ".github/workflows/harness-e2e.yml"

permissions:
  contents: read

jobs:
  python-harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install THM and pinned harness SDKs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install openai-agents==0.22.0 langchain-core==1.6.2 mcp==2.0.0
      - name: Run direct and MCP integration checks
        run: |
          mkdir -p integration-output
          python research/harness_e2e.py --output integration-output/harness-e2e.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thm-python-harness-e2e
          path: integration-output/
          retention-days: 30

  openclaw-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install THM MCP server and pinned OpenClaw
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . mcp==2.0.0
          npm install -g openclaw@2026.9.2
      - name: Build synthetic THM index
        run: |
          mkdir -p integration-output
          python - <<'PY'
          from pathlib import Path
          from thm.retrieval import Document, SearchIndex
          path = Path('integration-output/openclaw-recall.sqlite3').resolve()
          idx = SearchIndex(path)
          try:
              idx.replace_scope('openclaw-e2e', [Document(
                  'openclaw-port','openclaw-e2e','synthetic',0,
                  'The OpenClaw integration database port is 5439.',
                  speaker='user',source='file:synthetic-openclaw',tier='T2')])
          finally:
              idx.close()
          PY
      - name: Configure and probe THM as an OpenClaw MCP server
        env:
          OPENCLAW_TEST_HOME: ${{ runner.temp }}/openclaw-home
        run: |
          mkdir -p "$OPENCLAW_TEST_HOME"
          DB="$(pwd)/integration-output/openclaw-recall.sqlite3"
          python - <<PY > integration-output/openclaw-server.json
          import json
          print(json.dumps({"command":"python","args":["-m","thm.mcp_server","--db","$DB","--scope","openclaw-e2e"]}))
          PY
          HOME="$OPENCLAW_TEST_HOME" openclaw mcp set thm "$(cat integration-output/openclaw-server.json)"
          HOME="$OPENCLAW_TEST_HOME" openclaw mcp doctor thm --probe --json | tee integration-output/openclaw-probe.json
          grep -q 'thm_recall' integration-output/openclaw-probe.json
          grep -q 'thm_status' integration-output/openclaw-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thm-openclaw-mcp-e2e
          path: integration-output/
          retention-days: 30
