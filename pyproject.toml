[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thm-local-memory"
version = "1.5.0"
description = "Local scoped retrieval, memory observations and shadow residency control for THM"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.7,<1"]
semantic-torch = ["sentence-transformers>=3,<6", "numpy>=1.26,<3"]
semantic-onnx = ["sentence-transformers[onnx]>=3,<6", "numpy>=1.26,<3"]
semantic-openvino = ["sentence-transformers[openvino]>=3,<6", "nncf>=2,<3", "numpy>=1.26,<3"]
cuda = ["sentence-transformers>=3,<6", "numpy>=1.26,<3"]
semantic = ["sentence-transformers>=3,<6", "numpy>=1.26,<3"]
openai = ["openai-agents>=0.22,<0.23"]
langchain = ["langchain-core>=1.6,<1.7"]
mcp = ["mcp>=2,<3"]
harnesses = ["openai-agents>=0.22,<0.23", "langchain-core>=1.6,<1.7", "mcp>=2,<3"]

[project.scripts]
thm = "thm.__main__:main"
thm-runtime = "thm.runtime.cli:main"
thm-recall = "thm.__main__:main"
thm-mcp = "thm.mcp_server:main"
thm-mcp-legacy = "thm.mcp_legacy_server:main"

[project.entry-points."hermes_agent.memory_providers"]
thm = "thm.hermes_v14_plugin:THMProvider"

[tool.setuptools.packages.find]
include = ["thm*", "scripts"]
